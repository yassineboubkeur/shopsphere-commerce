spring:
  application:
    name: api-gateway

server:
  port: 8080

eureka:
  enabled: true
  url: http://localhost:8761/eureka
  name: api-gateway
  host: localhost
  port: ${server.port}
  heartbeat-interval-seconds: 30
  refresh-interval-seconds: 30

jwt:
  secret: c2hvcHNwaGVyZS1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tZ2VuZXJhdGlvbi11c2UtaW4tcHJvZHVjdGlvbi1hbmQtbXVzdC1iZS1sb25nLWVub3VnaA==

gateway:
  timeout:
    connect: 3000
    response: 5000
  retry:
    max-attempts: 2
    delay-seconds: 1
  routes:
    /api/auth: http://localhost:8081
    /api/products: http://localhost:8082
    /api/orders: http://localhost:8083
    /api/payments: http://localhost:8084
    /api/inventory: http://localhost:8085
    /api/notifications: http://localhost:8086
    /api/analytics: http://localhost:8087
