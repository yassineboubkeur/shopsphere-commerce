spring:
  application:
    name: service-discovery

server:
  port: 8761

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers,beans,conditions,prometheus
  endpoint:
    health:
      show-details: always

logging:
  structured:
    format:
      console: logstash

registry:
  eviction:
    interval-seconds: 10
    expiry-seconds: 90