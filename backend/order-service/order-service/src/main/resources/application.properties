spring.application.name=order-service

spring.datasource.url=jdbc:postgresql://localhost:5432/shopsphere_order
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

server.port=8083

eureka.enabled=true
eureka.url=http://localhost:8761/eureka
eureka.name=order-service
eureka.host=localhost
eureka.port=${server.port}
eureka.heartbeat-interval-seconds=30

management.endpoints.web.exposure.include=health,info,metrics,env,loggers,beans,conditions,prometheus
management.endpoint.health.show-details=always
logging.structured.format.console=logstash
