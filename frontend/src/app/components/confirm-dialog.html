@if (dialog()) {
  <div class="overlay" (click)="cancelAction()">
    <div class="dialog" role="alertdialog" aria-modal="true" (click)="$event.stopPropagation()">
      <div class="card">
        <div class="icon" [class]="icon">
          @switch (icon) {
            @case ('trash') {
              <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18" />
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                <line x1="10" y1="11" x2="10" y2="17" />
                <line x1="14" y1="11" x2="14" y2="17" />
              </svg>
            }
            @case ('cancel') {
              <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <line x1="15" y1="9" x2="9" y2="15" />
                <line x1="9" y1="9" x2="15" y2="15" />
              </svg>
            }
            @case ('warning') {
              <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
                <line x1="12" y1="9" x2="12" y2="13" />
                <line x1="12" y1="17" x2="12.01" y2="17" />
              </svg>
            }
          }
        </div>

        <h2 class="title">{{ title }}</h2>
        <p class="message">{{ message }}</p>

        <div class="actions">
          <button type="button" class="btn-cancel" (click)="cancelAction()">{{ cancelLabel }}</button>
          <button type="button" class="btn-confirm" [class]="confirmClass" (click)="confirmAction()">{{ confirmLabel }}</button>
        </div>
      </div>
    </div>
  </div>
}
