<div class="auth-page">
  <form class="card auth-form" (ngSubmit)="submit()" [formGroup]="form">
    <h2>Login</h2>
    @if (error()) {
      <div class="alert error">{{ error() }}</div>
    }

    <label>
      Email
      <input type="email" formControlName="email" placeholder="you@example.com" autocomplete="email" />
      @if (form.get('email')?.invalid && form.get('email')?.touched) {
        <span class="field-error">A valid email is required.</span>
      }
    </label>

    <label>
      Password
      <input type="password" formControlName="password" placeholder="••••••••" autocomplete="current-password" />
      @if (form.get('password')?.invalid && form.get('password')?.touched) {
        <span class="field-error">Password is required.</span>
      }
    </label>

    <button type="submit" class="btn btn-primary" [disabled]="loading()">
      {{ loading() ? 'Signing in...' : 'Login' }}
    </button>

    <p class="hint">
      No account? <a routerLink="/register">Register</a>
    </p>
  </form>
</div>
